name: Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # The app and its tests have no package dependencies or lockfile.
      - name: Test
        run: npm test

      - name: Build static app
        run: npm run build

      - name: Save tested build
        uses: actions/upload-artifact@v4
        with:
          name: static-app
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy-staging:
    name: Deploy staging
    needs: build
    # Forks and Dependabot cannot access repository deployment secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://test-codeflowfm.pages.dev/
    # Every PR shares one staging hostname; never overlap active uploads.
    concurrency:
      group: cloudflare-pages-staging
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: static-app
          path: dist/

      - name: Ensure separate staging project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-staging-project.mjs

      - name: Deploy staging to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # Match this project's production branch to update its root hostname.
          command: pages deploy dist --project-name=test-codeflowfm --branch=staging --commit-hash=${{ github.sha }}

      - name: Add staging links to run summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          printf '%s\n' 'Staging: https://test-codeflowfm.pages.dev/' "Deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: static-app
          path: dist/

      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See docs/04-cloudflare-pages-deployment.md.'
            exit 1
          fi

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=codeflowfm --branch=master --commit-hash=${{ github.sha }}

      - name: Add deployment link to run summary
        if: steps.deploy.outcome == 'success'
        run: |
          printf '%s\n' 'Production: https://codeflowfm.pages.dev/' >> "$GITHUB_STEP_SUMMARY"
