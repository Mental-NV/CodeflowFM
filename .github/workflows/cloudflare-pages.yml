name: Static web app CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-checks-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # The app and its tests have no package dependencies or lockfile.
      - name: Test
        run: npm test

      - name: Build static app
        run: npm run build

      - name: Save tested build
        uses: actions/upload-artifact@v7
        with:
          name: static-app
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy-staging:
    name: Deploy staging
    needs: build
    # Forks and Dependabot cannot access repository deployment secrets.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://test-codeflowfm.pages.dev/
    # Every PR shares one staging hostname; never overlap active uploads.
    concurrency:
      group: cloudflare-pages-staging
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download tested build
        uses: actions/download-artifact@v8
        with:
          name: static-app
          path: dist/

      - name: Ensure separate staging project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-staging-project.mjs

      - name: Deploy staging to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # Match this project's production branch to update its root hostname.
          command: pages deploy dist --project-name=test-codeflowfm --branch=staging --commit-hash=${{ github.sha }}

      - name: Add staging links to run summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          printf '%s\n' 'Staging: https://test-codeflowfm.pages.dev/' "Deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download tested build
        uses: actions/download-artifact@v8
        with:
          name: static-app
          path: dist/

      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. See docs/04-cloudflare-pages-deployment.md.'
            exit 1
          fi

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=codeflowfm --branch=master --commit-hash=${{ github.sha }}

      - name: Add deployment link to run summary
        if: steps.deploy.outcome == 'success'
        run: |
          printf '%s\n' 'Production: https://codeflowfm.pages.dev/' >> "$GITHUB_STEP_SUMMARY"

  deploy-azure:
    name: Deploy production to Azure App Service
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: azure-production
      url: ${{ steps.deploy.outputs.webapp-url }}
    concurrency:
      group: azure-app-service-production
      cancel-in-progress: false
    env:
      # Set these repository Actions variables; see docs/05-azure-app-service-deployment.md.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - name: Check Azure deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for setting in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Set $setting in repository Actions settings. See docs/05-azure-app-service-deployment.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Download tested build
        uses: actions/download-artifact@v8
        with:
          name: static-app
          path: dist/

      - name: Log in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure static hosting on Windows App Service
        run: |
          is_linux=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query reserved --output tsv)
          if [[ "$is_linux" != 'false' ]]; then
            echo '::error::This deployment requires a Windows (Code/IIS) App Service. See docs/05-azure-app-service-deployment.md.'
            exit 1
          fi
          # Serve the prebuilt files directly; do not run a server-side build.
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITE_RUN_FROM_PACKAGE=1 \
            --output none

      - name: Deploy static files to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: dist/

      - name: Add Azure deployment link to run summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          printf 'Azure App Service: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
